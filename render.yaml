services:
  - type: web
    name: rs3-efficiency-hub
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rs3hub-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
    autoDeploy: true

# Price refresh runs inside the web service via node-cron (server/jobs/scheduler.js)
# rather than as a separate Render cron, since cron jobs aren't free.
# Note: refresh only fires while the web service is awake. Free-tier services
# sleep after 15 min of inactivity, so external keepalive may be needed for
# reliable daily refreshes.

# The rs3hub-db database is provisioned/managed manually in the Render
# dashboard (not via this blueprint). The web service's DATABASE_URL above
# references it by name through fromDatabase, which resolves against any
# database in the same Render account.
